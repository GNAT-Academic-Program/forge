name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alire-project/setup-alire@v4
      - name: Build library
        run: alr -n build
      - name: Tests
        run: |
          cd tests
          alr -n build
          ./bin/tests
      - name: CLI runs the example and round-trips the document
        run: |
          cd cli
          alr -n build
          printf 'load ../examples/bracket.forge\nlist\ninfo base\nexport base /tmp/base.stl\nsave /tmp/rt.forge\n' \
            | ./bin/forge_cli
          ./bin/forge_cli -c "load /tmp/rt.forge" -c "info hole"
          test -s /tmp/base.stl
      - name: SPARK flow analysis
        run: |
          alr -n with gnatprove
          alr -n exec -- gnatprove -P forge.gpr --mode=flow --checks-as-errors=on
